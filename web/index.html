<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Stezhka</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="vendor/pmtiles/pmtiles.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <div class="brand brand-lg"><img src="icon.svg" alt="" width="36" height="36"> Stezhka</div>
      <h1 data-i18n="login.title"></h1>
      <label for="pw" data-i18n="login.password"></label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button type="submit" class="btn primary" data-i18n="login.submit"></button>
      <p id="login-error" class="error" role="alert"></p>
      <p id="login-nopw" class="note" data-i18n="login.no_password_hint" hidden></p>
      <p class="source-link"><a class="source-url" target="_blank" rel="noopener" data-i18n="app.source_code"></a></p>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <a class="brand" href="#"><img src="icon.svg" alt="" width="24" height="24"> Stezhka</a>
      <span class="spacer"></span>
      <label class="btn">
        <input id="upload" type="file" accept=".gpx,application/gpx+xml" multiple class="visually-hidden">
        <span data-i18n="actions.upload"></span>
      </label>
      <select id="lang" class="btn" data-i18n-attr="aria-label:settings.language"></select>
      <button id="settings-open" class="btn" type="button" data-i18n="actions.settings"></button>
      <button id="logout" class="btn ghost" type="button" data-i18n="actions.logout"></button>
    </header>

    <aside class="sidebar">
      <div class="sidebar-head">
        <h2 data-i18n="rides.title"></h2>
        <span id="ride-count" class="muted"></span>
      </div>
      <select id="bike-filter" class="btn filter" data-i18n-attr="aria-label:rides.filter_label" hidden></select>
      <ul id="ride-list" class="ride-list"></ul>
      <p id="no-rides" class="note" data-i18n="rides.empty" hidden></p>
      <p class="source-link"><a class="source-url" target="_blank" rel="noopener" data-i18n="app.source_code"></a></p>
    </aside>

    <main class="main">
      <section id="stats" class="stats" aria-live="polite"></section>
      <div class="map-wrap">
        <div id="map" class="map"></div>
        <div id="legend" class="legend"></div>
        <p id="map-note" class="map-note" data-i18n="map.no_basemap" hidden></p>
      </div>
      <div class="chart-wrap">
        <canvas id="chart" role="img" data-i18n-attr="aria-label:chart.aria"></canvas>
      </div>
    </main>
  </div>

  <dialog id="settings" class="settings">
    <div class="settings-head">
      <h2 data-i18n="settings.title"></h2>
      <button id="settings-close" class="btn ghost" type="button" data-i18n="actions.close"></button>
    </div>
    <section>
      <h3 data-i18n="settings.bikes"></h3>
      <ul id="bike-list" class="bike-list"></ul>
      <form id="bike-form" class="inline-form">
        <input id="bike-name" required maxlength="100" data-i18n-attr="placeholder:settings.bike_name,aria-label:settings.bike_name">
        <select id="bike-kind" data-i18n-attr="aria-label:settings.bike_kind"></select>
        <button type="submit" class="btn primary small" data-i18n="settings.add_bike"></button>
      </form>
    </section>
    <section>
      <h3 data-i18n="settings.keys"></h3>
      <p class="note" data-i18n="settings.keys_help"></p>
      <ul id="key-list" class="bike-list"></ul>
      <form id="key-form" class="inline-form">
        <input id="key-name" required maxlength="100" data-i18n-attr="placeholder:settings.key_name,aria-label:settings.key_name">
        <button type="submit" class="btn primary small" data-i18n="settings.add_key"></button>
      </form>
      <div id="key-new" class="key-new" hidden>
        <p class="note" data-i18n="settings.key_once"></p>
        <div class="inline-form">
          <input id="key-value" readonly>
          <button id="key-copy" type="button" class="btn small" data-i18n="settings.copy"></button>
        </div>
      </div>
    </section>
    <section>
      <h3 data-i18n="settings.password"></h3>
      <form id="password-form" class="stack-form">
        <input id="pw-current" type="password" autocomplete="current-password" required data-i18n-attr="placeholder:settings.current_password,aria-label:settings.current_password">
        <input id="pw-new" type="password" autocomplete="new-password" required minlength="12" data-i18n-attr="placeholder:settings.new_password,aria-label:settings.new_password">
        <input id="pw-repeat" type="password" autocomplete="new-password" required minlength="12" data-i18n-attr="placeholder:settings.repeat_password,aria-label:settings.repeat_password">
        <button type="submit" class="btn primary small" data-i18n="settings.change_password"></button>
        <p id="pw-msg" class="error" role="alert"></p>
      </form>
    </section>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
